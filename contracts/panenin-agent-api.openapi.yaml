      tags:
      - internal-agent
      summary: Resolve Identity
      operationId: resolve_identity_api_v1_internal_agent_identity_resolve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityResolveRequest'
        required: true
      responses:
        '200':
          description: Successful Panenin Core response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid service credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Resolved identity is not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Business state or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - AgentBearer: []
