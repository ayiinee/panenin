components:
  schemas:
    AuthMeResponse:
      properties:
        data:
          $ref: '#/components/schemas/AuthenticatedUser'
        error:
          type: 'null'
          title: Error
        requestId:
          type: string
          title: Requestid
      type: object
      required:
      - data
      - requestId
      title: AuthMeResponse
    AuthenticatedUser:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
      type: object
      required:
      - id
      title: AuthenticatedUser
    BuyPreviewRequest:
      properties:
        channelSubject:
          type: string
          pattern: ^wa:v1:[0-9a-f]{16,128}$
          title: Channelsubject
        commodity:
          type: string
          maxLength: 120
          minLength: 2
          title: Commodity
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,11}|(?=[\d.]{1,15}0*$)\d{0,11}\.\d{0,3}0*$)
          title: Quantity
        unit:
          type: string
          maxLength: 20
          minLength: 1
          title: Unit
        gradeTolerance:
          items:
            type: string
          type: array
          maxItems: 10
          title: Gradetolerance
        maxPrice:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,14}|(?=[\d.]{1,17}0*$)\d{0,14}\.\d{0,2}0*$)
          title: Maxprice
        neededAt:
          type: string
          format: date-time
          title: Neededat
        deliveryMethod:
          type: string
          enum:
          - PICKUP
          - SELLER_DELIVERY
          - THIRD_PARTY
          title: Deliverymethod
      type: object
      required:
      - channelSubject
      - commodity
      - quantity
      - unit
      - maxPrice
      - neededAt
      - deliveryMethod
      title: BuyPreviewRequest
    CancelActionRequest:
      properties:
        channelSubject:
          type: string
          pattern: ^wa:v1:[0-9a-f]{16,128}$
          title: Channelsubject
      type: object
      required:
      - channelSubject
      title: CancelActionRequest
    CatalogSearchRequest:
      properties:
        channelSubject:
          type: string
          pattern: ^wa:v1:[0-9a-f]{16,128}$
          title: Channelsubject
        commodity:
          type: string
          maxLength: 120
          minLength: 2
          title: Commodity
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,11}|(?=[\d.]{1,15}0*$)\d{0,11}\.\d{0,3}0*$)
          title: Quantity
        unit:
          type: string
          maxLength: 20
          minLength: 1
          title: Unit
        maxPrice:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,14}|(?=[\d.]{1,17}0*$)\d{0,14}\.\d{0,2}0*$)
          title: Maxprice
        neededAt:
          type: string
          format: date-time
          title: Neededat
      type: object
      required:
      - channelSubject
      - commodity
      - quantity
      - unit
      - maxPrice
      - neededAt
      title: CatalogSearchRequest
    ConfirmActionRequest:
      properties:
        channelSubject:
          type: string
          pattern: ^wa:v1:[0-9a-f]{16,128}$
          title: Channelsubject
        confirmationCode:
          type: string
          maxLength: 12
          minLength: 6
          pattern: ^[A-Za-z0-9]+$
          title: Confirmationcode
        idempotencyKey:
          type: string
          maxLength: 36
          minLength: 36
          title: Idempotencykey
      type: object
      required:
      - channelSubject
      - confirmationCode
      - idempotencyKey
      title: ConfirmActionRequest
    ControlPreviewRequest:
      properties:
        channelSubject:
          type: string
          pattern: ^wa:v1:[0-9a-f]{16,128}$
          title: Channelsubject
        action:
          type: string
          enum:
          - ACCEPT_ORDER
          - REJECT_ORDER
          - MARK_ORDER_READY
          - CANCEL_ORDER
          - COMPLETE_ORDER
          - PAUSE_LISTING
          - PUBLISH_LISTING
          - ADJUST_INVENTORY
          title: Action
        targetId:
          type: string
          format: uuid
          title: Targetid
        reason:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Reason
        quantity:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,11}|(?=[\d.]{1,15}0*$)\d{0,11}\.\d{0,3}0*$)
          - type: 'null'
          title: Quantity
      type: object
      required:
      - channelSubject
      - action
      - targetId
      title: ControlPreviewRequest
    DemandCreateRequest:
      properties:
        commodity:
          type: string
          maxLength: 120
          minLength: 2
          title: Commodity
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,11}|(?=[\d.]{1,15}0*$)\d{0,11}\.\d{0,3}0*$)
          title: Quantity
        unit:
          type: string
          maxLength: 20
          minLength: 1
          title: Unit
        gradeTolerance:
          items:
            type: string
          type: array
          maxItems: 10
          title: Gradetolerance
        maxPrice:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,14}|(?=[\d.]{1,17}0*$)\d{0,14}\.\d{0,2}0*$)
          title: Maxprice
        neededAt:
          type: string
          format: date-time
          title: Neededat
        deliveryAddress:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Deliveryaddress
        deliveryLatitude:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Deliverylatitude
        deliveryLongitude:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Deliverylongitude
      type: object
      required:
      - commodity
      - quantity
      - unit
      - maxPrice
      - neededAt
      title: DemandCreateRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IdentityLinkRequest:
      properties:
        channel:
          type: string
          const: WHATSAPP
          title: Channel
        channelSubject:
          type: string
          pattern: ^wa:v1:[0-9a-f]{16,128}$
          title: Channelsubject
        linkCode:
          type: string
          maxLength: 12
          minLength: 6
          pattern: ^[A-Za-z0-9]+$
          title: Linkcode
      type: object
      required:
      - channel
      - channelSubject
      - linkCode
      title: IdentityLinkRequest
    IdentityResolveRequest:
      properties:
        channel:
